<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创业公司季度财务报表</title>
</head>
<body>
    <h1>创业公司财务报表</h1>
    
    <table>
        <caption>
            <strong>2024 年第一季度损益表</strong>
            <br>
            <small>单位：万元，数据经过审计确认</small>
        </caption>
        <thead>
            <tr>
                <th scope="col" id="item">项目</th>
                <th scope="col" id="jan">1月</th>
                <th scope="col" id="feb">2月</th>
                <th scope="col" id="mar">3月</th>
                <th scope="col" id="total">季度合计</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" id="revenue" colspan="5">营业收入</th>
            </tr>
            <tr>
                <th scope="row" id="product-sales" headers="revenue">产品销售</th>
                <td headers="revenue product-sales jan">58.5</td>
                <td headers="revenue product-sales feb">72.3</td>
                <td headers="revenue product-sales mar">89.7</td>
                <td headers="revenue product-sales total">220.5</td>
            </tr>
            <tr>
                <th scope="row" id="service-income" headers="revenue">服务收入</th>
                <td headers="revenue service-income jan">12.4</td>
                <td headers="revenue service-income feb">15.8</td>
                <td headers="revenue service-income mar">18.9</td>
                <td headers="revenue service-income total">47.1</td>
            </tr>
            <tr>
                <th scope="row" id="revenue-subtotal" headers="revenue">收入小计</th>
                <td headers="revenue revenue-subtotal jan">70.9</td>
                <td headers="revenue revenue-subtotal feb">88.1</td>
                <td headers="revenue revenue-subtotal mar">108.6</td>
                <td headers="revenue revenue-subtotal total">267.6</td>
            </tr>
            <tr>
                <th scope="rowgroup" id="costs" colspan="5">营业成本</th>
            </tr>
            <tr>
                <th scope="row" id="material-cost" headers="costs">材料成本</th>
                <td headers="costs material-cost jan">25.3</td>
                <td headers="costs material-cost feb">31.7</td>
                <td headers="costs material-cost mar">38.9</td>
                <td headers="costs material-cost total">95.9</td>
            </tr>
            <tr>
                <th scope="row" id="labor-cost" headers="costs">人工成本</th>
                <td headers="costs labor-cost jan">18.7</td>
                <td headers="costs labor-cost feb">19.2</td>
                <td headers="costs labor-cost mar">19.8</td>
                <td headers="costs labor-cost total">57.7</td>
            </tr>
            <tr>
                <th scope="row" id="costs-subtotal" headers="costs">成本小计</th>
                <td headers="costs costs-subtotal jan">44.0</td>
                <td headers="costs costs-subtotal feb">50.9</td>
                <td headers="costs costs-subtotal mar">58.7</td>
                <td headers="costs costs-subtotal total">153.6</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row" id="profit">净利润</th>
                <td headers="profit jan">26.9</td>
                <td headers="profit feb">37.2</td>
                <td headers="profit mar">49.9</td>
                <td headers="profit total"><strong>114.0</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
