<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 编程导航</title>
</head>
<body>
    <form>
        <h2>加入编程导航大家庭</h2>
        
        <fieldset>
            <legend>账户信息</legend>
            <label for="username">用户名：</label>
            <input type="text" id="username" name="username" required>
            
            <label for="email">邮箱：</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">密码：</label>
            <input type="password" id="password" name="password" required>
        </fieldset>
        
        <fieldset>
            <legend>个人信息</legend>
            <label for="fullname">真实姓名：</label>
            <input type="text" id="fullname" name="fullname">
            
            <p>性别：</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">男</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">女</label>
            
            <label for="birthday">生日：</label>
            <input type="date" id="birthday" name="birthday">
            
            <label for="city">所在城市：</label>
            <select id="city" name="city">
                <option value="">请选择</option>
                <option value="beijing">北京</option>
                <option value="shanghai">上海</option>
                <option value="guangzhou">广州</option>
                <option value="shenzhen">深圳</option>
            </select>
        </fieldset>
        
        <fieldset>
            <legend>学习兴趣</legend>
            <p>您对哪些技术感兴趣：</p>
            <input type="checkbox" id="html" name="interests" value="html">
            <label for="html">HTML/CSS</label><br>
            <input type="checkbox" id="javascript" name="interests" value="javascript">
            <label for="javascript">JavaScript</label><br>
            <input type="checkbox" id="python" name="interests" value="python">
            <label for="python">Python</label><br>
            <input type="checkbox" id="java" name="interests" value="java">
            <label for="java">Java</label>
        </fieldset>
        
        <fieldset>
            <legend>头像上传</legend>
            <label for="avatar">选择头像：</label>
            <input type="file" id="avatar" name="avatar" accept="image/*">
        </fieldset>
        
        <button type="submit">注册账户</button>
    </form>
</body>
</html>
