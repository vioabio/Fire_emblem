<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品展示 - 程序员鱼皮的作品</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>程序员鱼皮的产品展示</h1>

            <p>为程序员打造的实用工具集合</p>

        </header>

        
        <div class="product-grid">
            <div class="product-card">
                <h3>编程导航</h3>

                <p>程序员一站式编程学习交流社区，免费的编程学习路线、入门教程、原创项目教程。</p>

                <div class="price">免费</div>

                <button class="button">立即访问</button>

            </div>

            
            <div class="product-card">
                <h3>面试鸭</h3>

                <p>持续维护的企业面试题库网站，帮你拿到满意 offer！包含最新面试题。</p>

                <div class="price">免费</div>

                <button class="button">开始刷题</button>

            </div>

            
            <div class="product-card">
                <h3>老鱼简历</h3>

                <p>专业高效的简历制作工具，提供精美简历模板，一站式简历制作服务。</p>

                <div class="price">¥29/月</div>

                <button class="button">制作简历</button>

            </div>

            
            <div class="product-card">
                <h3>算法导航</h3>

                <p>交互式算法学习平台，通过可视化和交互的方式，轻松理解算法和数据结构。</p>

                <div class="price">免费</div>

                <button class="button">开始学习</button>

            </div>

            
            <div class="product-card">
                <h3>剪切助手</h3>

                <p>功能丰富的超级剪切板工具，跨设备同步，大幅提高工作效率。</p>

                <div class="price">¥19/月</div>

                <button class="button">立即下载</button>

            </div>

        </div>

    </div>

</body>

</html>
