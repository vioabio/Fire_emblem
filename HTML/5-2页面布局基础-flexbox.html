<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 导航栏练习</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 1rem 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        
        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .nav-menu a:hover {
            background-color: #555;
        }
        
        .main-content {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-menu {
                gap: 1rem;
            }
        }
    </style>

</head>

<body>
    <nav class="navbar">
        <div class="logo">编程导航</div>

        <ul class="nav-menu">
            <li><a href="/">首页</a></li>

            <li><a href="/courses">课程</a></li>

            <li><a href="/projects">项目</a></li>

            <li><a href="/community">社区</a></li>

            <li><a href="/about">关于</a></li>

        </ul>

    </nav>

    
    <main class="main-content">
        <h1>欢迎来到编程导航</h1>

        <p>这是一个使用 Flexbox 创建的响应式导航栏示例。</p>

        <p>当屏幕宽度小于 768px 时，导航栏会自动变为垂直布局。</p>

    </main>

</body>

</html>
