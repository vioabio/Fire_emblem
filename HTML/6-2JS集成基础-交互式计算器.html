<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>计算器 - 算法导航</title>

    <style>
        .calculator {
            max-width: 300px;
            margin: 50px auto;
            background-color: #2c3e50;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .display {
            background-color: #34495e;
            color: white;
            font-size: 24px;
            padding: 15px;
            text-align: right;
            margin-bottom: 20px;
            border-radius: 5px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #7f8c8d;
            color: white;
        }
        
        button:hover {
            background-color: #95a5a6;
        }
        
        .operator {
            background-color: #e67e22;
        }
        
        .operator:hover {
            background-color: #f39c12;
        }
        
        .equals {
            background-color: #27ae60;
        }
        
        .equals:hover {
            background-color: #2ecc71;
        }
        
        .clear {
            background-color: #e74c3c;
        }
        
        .clear:hover {
            background-color: #c0392b;
        }
    </style>

</head>

<body>
    <div class="calculator">
        <div class="display" id="display">0</div>

        
        <div class="buttons">
            <button class="clear" onclick="calculator.clear()">C</button>

            <button onclick="calculator.appendNumber('/')" class="operator">÷</button>

            <button onclick="calculator.appendNumber('*')" class="operator">×</button>

            <button onclick="calculator.deleteLast()">←</button>

            
            <button onclick="calculator.appendNumber('7')">7</button>

            <button onclick="calculator.appendNumber('8')">8</button>

            <button onclick="calculator.appendNumber('9')">9</button>

            <button onclick="calculator.appendNumber('-')" class="operator">-</button>

            
            <button onclick="calculator.appendNumber('4')">4</button>

            <button onclick="calculator.appendNumber('5')">5</button>

            <button onclick="calculator.appendNumber('6')">6</button>

            <button onclick="calculator.appendNumber('+')" class="operator">+</button>

            
            <button onclick="calculator.appendNumber('1')">1</button>

            <button onclick="calculator.appendNumber('2')">2</button>

            <button onclick="calculator.appendNumber('3')">3</button>

            <button onclick="calculator.calculate()" class="equals" style="grid-row: span 2">=</button>

            
            <button onclick="calculator.appendNumber('0')" style="grid-column: span 2">0</button>

            <button onclick="calculator.appendNumber('.')">.</button>

        </div>

    </div>

    
    <script>
        class Calculator {
            constructor() {
                this.display = document.getElementById('display');
                this.currentInput = '0';
                this.operator = null;
                this.previousInput = null;
                this.waitingForOperand = false;
            }
            
            updateDisplay() {
                this.display.textContent = this.currentInput;
            }
            
            appendNumber(num) {
                if (this.waitingForOperand) {
                    this.currentInput = num;
                    this.waitingForOperand = false;
                } else {
                    this.currentInput = this.currentInput === '0' ? num : this.currentInput + num;
                }
                
                this.updateDisplay();
            }
            
            clear() {
                this.currentInput = '0';
                this.operator = null;
                this.previousInput = null;
                this.waitingForOperand = false;
                this.updateDisplay();
            }
            
            deleteLast() {
                if (this.currentInput.length > 1) {
                    this.currentInput = this.currentInput.slice(0, -1);
                } else {
                    this.currentInput = '0';
                }
                this.updateDisplay();
            }
            
            calculate() {
                if (this.operator && this.previousInput !== null && !this.waitingForOperand) {
                    const prev = parseFloat(this.previousInput);
                    const current = parseFloat(this.currentInput);
                    let result;
                    
                    switch (this.operator) {
                        case '+':
                            result = prev + current;
                            break;
                        case '-':
                            result = prev - current;
                            break;
                        case '*':
                            result = prev * current;
                            break;
                        case '/':
                            if (current === 0) {
                                alert('不能除以零！');
                                return;
                            }
                            result = prev / current;
                            break;
                        default:
                            return;
                    }
                    
                    this.currentInput = result.toString();
                    this.operator = null;
                    this.previousInput = null;
                    this.waitingForOperand = true;
                    this.updateDisplay();
                }
            }
        }
        
        // 重写 appendNumber 方法以处理操作符
        Calculator.prototype.appendNumber = function(input) {
            if (['+', '-', '*', '/'].includes(input)) {
                if (this.operator && this.previousInput !== null && !this.waitingForOperand) {
                    this.calculate();
                }
                
                this.previousInput = this.currentInput;
                this.operator = input;
                this.waitingForOperand = true;
            } else {
                if (this.waitingForOperand) {
                    this.currentInput = input;
                    this.waitingForOperand = false;
                } else {
                    this.currentInput = this.currentInput === '0' ? input : this.currentInput + input;
                }
            }
            
            this.updateDisplay();
        };
        
        // 初始化计算器
        const calculator = new Calculator();
    </script>

</body>

</html>
