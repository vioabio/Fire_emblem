<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>属性练习页面</title>
</head>
<body>
    <!-- 主容器区域 -->
    <div id="main-container" class="wrapper content">
        <h1>HTML 属性练习</h1>
        
        <!-- 带提示的段落 -->
        <p title="鼠标悬停查看提示">
            这个段落有一个 title 属性，将鼠标悬停在文字上试试看！
        </p>
        
        <!-- 外部链接 -->
        <p>
            想了解更多 HTML 知识，可以访问 
            <a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML" 
               target="_blank" 
               title="MDN HTML 文档">MDN 官方文档</a>
        </p>
    </div>
    
    <!-- 页面底部 -->
</body>
</html>
